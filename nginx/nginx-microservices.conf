# FIX: Nginx API Gateway - Routes requests to appropriate microservices
events {
    worker_connections 1024;
}

http {
    upstream auth_service {
        server auth-service:3001;
    }

    upstream user_service {
        server user-service:3002;
    }

    upstream chat_service {
        server chat-service:3003;
    }

    upstream post_service {
        server post-service:3004;
    }

    upstream friend_service {
        server friend-service:3005;
    }

    upstream frontend {
        server frontend:80;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 10M;

        # Frontend
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth service - match with and without trailing slash
        location /api/auth {
            rewrite ^/api/auth$ /api/auth/ permanent;
        }
        location /api/auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # User service
        location /api/users {
            rewrite ^/api/users$ /api/users/ permanent;
        }
        location /api/users/ {
            proxy_pass http://user_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        location /api/profile {
            rewrite ^/api/profile$ /api/profile/ permanent;
        }
        location /api/profile/ {
            proxy_pass http://user_service/profile/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # API Keys
        location /api/keys {
            rewrite ^/api/keys$ /api/keys/ permanent;
        }
        location /api/keys/ {
            proxy_pass http://user_service/keys/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Chat service
        location /api/chat {
            rewrite ^/api/chat$ /api/chat/ permanent;
        }
        location /api/chat/ {
            proxy_pass http://chat_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;

            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /socket.io/ {
            proxy_pass http://chat_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
        }

        # Post service - critical: handle both /api/posts and /api/posts/
        location = /api/posts {
            proxy_pass http://post_service/posts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
        location /api/posts/ {
            proxy_pass http://post_service/posts/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Friend service
        location /api/friends {
            rewrite ^/api/friends$ /api/friends/ permanent;
        }
        location /api/friends/ {
            proxy_pass http://friend_service/friends/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }

        # Images - serve uploaded files
        location /images/ {
            proxy_pass http://auth_service/images/;
            proxy_set_header Host $host;
        }

        # Health check
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
    }
}
