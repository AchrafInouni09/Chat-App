global:
  scrape_interval: 15s
  evaluation_interval: 15s

# FIX: Added alerting rules file
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alerts.yml"

scrape_configs:
  # Backend application metrics
  - job_name: "chatapp-backend"
    static_configs:
      - targets:
          - chatapp-backend:3000
    scrape_interval: 30s

  # FIX: Added node-exporter for host system metrics
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - node-exporter:9100

  # FIX: Added mysqld-exporter for database metrics
  - job_name: "mysql"
    static_configs:
      - targets:
          - mysqld-exporter:9104

  # FIX: Added cAdvisor for container metrics
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - cadvisor:8080
