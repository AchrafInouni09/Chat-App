# =============================================================================
# FIX: Microservices Architecture - docker-compose.microservices.yml
# =============================================================================
# PM Documentation: This orchestration file manages all microservices and 
# infrastructure components for the Chat Application.
#
# Architecture Overview:
# - 5 Business Microservices (auth, user, chat, post, friend)
# - 1 API Gateway (Nginx) for request routing
# - 1 Frontend Application (React + Vite)
# - 1 Database (MySQL 8.0)
# - 4 Monitoring Services (Prometheus, Grafana, Node Exporter, cAdvisor)
# - 1 Backup Service (Automated daily backups)
#
# Service Startup Order (managed by depends_on + healthcheck):
# 1. MySQL (database foundation)
# 2. Auth Service (authentication provider - required by all other services)
# 3. User, Chat, Post, Friend Services (business logic)
# 4. Nginx (API gateway for routing external requests)
# 5. Frontend (user interface)
# 6. Monitoring Stack (Prometheus + Grafana + exporters)
#
# Networks:
# - backend: Used by application services and database
# - monitoring: Used by Prometheus and exporters
#
# Health Checks: All critical services have health checks to ensure proper
# startup sequencing and automatic recovery from failures.
# =============================================================================

services:
  # ===========================================================================
  # DATABASE SERVICE
  # ===========================================================================
  # PM Note: MySQL 8.0 - Central data store for all microservices
  # Purpose: Stores users, conversations, messages, posts, friendships
  # Port: 3306 (internal only, not exposed to host)
  # Data Persistence: mysql_data volume for permanent storage
  # Health Check: Ensures database is ready before dependent services start
  # ===========================================================================
  mysql:
    image: mysql:8.0
    container_name: chatapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-chat_app}
      MYSQL_USER: ${DB_USER:-chat}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${DB_USER:-chat}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend

  # ===========================================================================
  # AUTH SERVICE - Authentication & JWT Management
  # ===========================================================================
  # PM Note: Core authentication microservice - handles all user authentication
  # Responsibilities:
  # - User login with JWT token generation (24-hour expiry)
  # - User registration with password hashing and avatar upload
  # - Token verification endpoint (used by all other services)
  # Port: 3001 (internal), accessible via Nginx at /api/auth/*
  # Dependencies: MySQL (for user credentials storage)
  # Critical: All other business services depend on this for authentication
  # ===========================================================================
  auth-service:
    build: ./services/auth-service
    container_name: chatapp-auth-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-chat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chat_app}
      JWT_SECRET: ${JWT_SECRET}
      AUTH_PORT: 3001
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # USER SERVICE - User Profile Management
  # ===========================================================================
  # PM Note: Manages user profiles and account information
  # Responsibilities:
  # - User profile retrieval (GET /profile/me, /profile/:id)
  # - Profile updates (bio, firstName, lastName, etc.)
  # - Avatar management and serving
  # - User search and discovery
  # Port: 3002 (internal), accessible via Nginx at /api/users/*
  # Dependencies: MySQL (user data), Auth Service (token verification)
  # Volume: Shares uploads_data with auth-service for avatar storage
  # ===========================================================================
  user-service:
    build: ./services/user-service
    container_name: chatapp-user-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-chat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chat_app}
      USER_PORT: 3002
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # CHAT SERVICE - Real-Time Messaging
  # ===========================================================================
  # PM Note: Handles all messaging and real-time communication features
  # Responsibilities:
  # - WebSocket connections via Socket.io for real-time messaging
  # - Conversation management (direct and group chats)
  # - Message history and persistence
  # - Online/offline user status tracking
  # - Message delivery and read receipts
  # Port: 3003 (internal), accessible via Nginx at /api/chat/* and /socket.io/*
  # Dependencies: MySQL (messages/conversations), Auth Service (token verification)
  # Technology: Socket.io for WebSocket connections
  # ===========================================================================
  chat-service:
    build: ./services/chat-service
    container_name: chatapp-chat-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-chat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chat_app}
      JWT_SECRET: ${JWT_SECRET}
      CHAT_PORT: 3003
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    expose:
      - "3003"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # POST SERVICE - Content & Posts Management
  # ===========================================================================
  # PM Note: Manages user-generated content and social features
  # Responsibilities:
  # - Post creation, retrieval, update, and deletion
  # - Like/unlike functionality
  # - Comments management
  # - Public/private post visibility
  # - User timeline and feed generation
  # Port: 3004 (internal), accessible via Nginx at /api/posts/*
  # Dependencies: MySQL (posts/likes/comments), Auth Service (token verification)
  # ===========================================================================
  post-service:
    build: ./services/post-service
    container_name: chatapp-post-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-chat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chat_app}
      POST_PORT: 3004
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    expose:
      - "3004"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # FRIEND SERVICE - Social Relationships Management
  # ===========================================================================
  # PM Note: Handles all friend-related operations and social graph
  # Responsibilities:
  # - Friend request sending and acceptance
  # - Friend list management
  # - Block/unblock users
  # - Friend status tracking (pending, accepted, blocked)
  # - Social graph queries (mutual friends, suggestions)
  # Port: 3005 (internal), accessible via Nginx at /api/friends/*
  # Dependencies: MySQL (friendships table), Auth Service (token verification)
  # ===========================================================================
  friend-service:
    build: ./services/friend-service
    container_name: chatapp-friend-service
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-chat}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME:-chat_app}
      FRIEND_PORT: 3005
    depends_on:
      mysql:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    expose:
      - "3005"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # NGINX - API Gateway & Reverse Proxy
  # ===========================================================================
  # PM Note: Central entry point for all external requests
  # Responsibilities:
  # - Routes requests to appropriate microservices based on URL path
  # - SSL/TLS termination for HTTPS
  # - Load balancing across service instances
  # - Static file serving and caching
  # Routing Rules:
  #   /api/auth/*    -> auth-service:3001
  #   /api/users/*   -> user-service:3002
  #   /api/chat/*    -> chat-service:3003
  #   /api/posts/*   -> post-service:3004
  #   /api/friends/* -> friend-service:3005
  # Ports: 80 (HTTP), 443 (HTTPS) - only ports exposed to host
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: chatapp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx-microservices.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - post-service
      - friend-service
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "--no-check-certificate", "https://127.0.0.1:443/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # ===========================================================================
  # FRONTEND - React Application
  # ===========================================================================
  # PM Note: User interface built with React + TypeScript + Vite
  # Features:
  # - Authentication pages (login, register)
  # - User profile management
  # - Real-time chat interface
  # - Posts feed and creation
  # - Friend management
  # Technology Stack: React 18, TypeScript, Vite, Tailwind CSS, Socket.io-client
  # Build: Multi-stage Docker build with nginx for serving static files
  # Port: 80 (internal), served through main Nginx gateway
  # ===========================================================================
  frontend:
    build: ./frontend
    container_name: chatapp-frontend
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - backend

  # ===========================================================================
  # PROMETHEUS - Metrics Collection & Monitoring
  # ===========================================================================
  # PM Note: Time-series database for collecting and storing metrics
  # Responsibilities:
  # - Scrapes metrics from all microservices (/metrics endpoints)
  # - Stores metrics data (30-day retention)
  # - Evaluates alerting rules
  # - Provides query interface for Grafana
  # Targets: All 5 microservices + node-exporter + mysqld-exporter + cAdvisor
  # Port: 9090 (accessible via browser for PromQL queries)
  # Data Retention: 30 days
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: chatapp-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus-microservices.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - user-service
      - chat-service
      - post-service
      - friend-service
    networks:
      - monitoring

  # ===========================================================================
  # NODE EXPORTER - System Metrics
  # ===========================================================================
  # PM Note: Collects hardware and OS-level metrics from the host system
  # Metrics Collected:
  # - CPU usage, load average
  # - Memory and swap usage
  # - Disk I/O and space
  # - Network traffic
  # - System uptime
  # Port: 9100 (scraped by Prometheus)
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: chatapp-node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    expose:
      - "9100"
    networks:
      - monitoring

  # ===========================================================================
  # MYSQLD EXPORTER - Database Metrics
  # ===========================================================================
  # PM Note: Collects MySQL database performance metrics
  # Metrics Collected:
  # - Query performance and slow queries
  # - Connection counts and status
  # - Table locks and deadlocks
  # - Replication status
  # - Buffer pool usage
  # Port: 9104 (scraped by Prometheus)
  # ===========================================================================
  mysqld-exporter:
    image: prom/mysqld-exporter:latest
    container_name: chatapp-mysqld-exporter
    restart: unless-stopped
    command:
      - "--mysqld.username=${DB_USER:-chat}:${DB_PASSWORD}"
      - "--mysqld.address=mysql:3306"
    expose:
      - "9104"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend
      - monitoring

  # ===========================================================================
  # CADVISOR - Container Metrics
  # ===========================================================================
  # PM Note: Collects resource usage and performance metrics for all containers
  # Metrics Collected:
  # - CPU, memory, and disk usage per container
  # - Network I/O per container
  # - Container lifecycle events
  # - Resource limits and throttling
  # Purpose: Helps identify resource bottlenecks and scaling needs
  # Port: 8080 (scraped by Prometheus)
  # ===========================================================================
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: chatapp-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - monitoring

  # ===========================================================================
  # GRAFANA - Metrics Visualization & Dashboards
  # ===========================================================================
  # PM Note: Web-based analytics and monitoring dashboards
  # Features:
  # - Pre-configured dashboards for microservices monitoring
  # - Real-time metrics visualization from Prometheus
  # - Alert management and notifications
  # - Custom dashboard creation
  # Access: http://localhost:3001
  # Default Credentials: admin / (set via GF_SECURITY_ADMIN_PASSWORD)
  # Data Source: Prometheus (auto-provisioned)
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: chatapp-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SERVER_ROOT_URL: http://localhost:3001
      GF_AUTH_ANONYMOUS_ENABLED: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana-dashboard.json:/var/lib/grafana/dashboards/main-dashboard.json:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring

  # ===========================================================================
  # BACKUP SERVICE - Automated Database Backups
  # ===========================================================================
  # PM Note: Automated MySQL database backup for disaster recovery
  # Functionality:
  # - Daily automated backups (runs every 24 hours)
  # - Compressed SQL dumps (gzip format)
  # - 7-day retention policy (configurable via BACKUP_RETENTION_DAYS)
  # - Manual restore capability via restore.sh script
  # Backup Location: ./database/backups/
  # Backup Format: backup_YYYYMMDD_HHMMSS.sql.gz
  # Recovery: Use ./database/scripts/restore.sh <backup_file>
  # ===========================================================================
  backup:
    image: mysql:8.0
    container_name: chatapp-backup
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${DB_NAME:-chat_app}
      MYSQL_USER: ${DB_USER:-chat}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      BACKUP_RETENTION_DAYS: 7
    volumes:
      - ./database/backups:/backups
      - ./database/scripts/backup.sh:/backup.sh:ro
      - ./database/scripts/restore.sh:/restore.sh:ro
    command: ["/bin/bash", "-c", "while true; do /backup.sh; sleep 86400; done"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - backend

# =============================================================================
# NETWORKS
# =============================================================================
# PM Note: Isolated networks for security and organization
# - backend: Application services + database communication
# - monitoring: Prometheus + exporters (isolated from application traffic)
# =============================================================================
networks:
  backend:
    driver: bridge
  monitoring:
    driver: bridge

# =============================================================================
# VOLUMES
# =============================================================================
# PM Note: Persistent data storage across container restarts
# - mysql_data: Database files (users, messages, posts, etc.)
# - prometheus_data: Metrics time-series data (30-day retention)
# - grafana_data: Dashboard configurations and user settings
# - uploads_data: User-uploaded files (avatars, attachments)
# =============================================================================
volumes:
  mysql_data:
  prometheus_data:
  grafana_data:
  uploads_data:
